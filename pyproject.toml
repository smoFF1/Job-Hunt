[project]
name = "job-hunter"
version = "0.1.0"
description = "Personal tool: scan Israeli job boards, filter/rank entry-level jobs, pre-fill applications (human submits)."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["job_hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
